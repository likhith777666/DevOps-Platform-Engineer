
replicaCount: 2

image:
  repository: my-flask-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8012
  targetPort: 8012

config:
  appName: my-app
  version: "1.0.0"

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
